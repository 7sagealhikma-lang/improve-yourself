    <style>
    :root{--bg:#07111f;--panel:#101f34;--line:#2a4262;--text:#edf4ff;--muted:#9eafc9;--blue:#42c9ff;--violet:#9b8cff;--green:#55e6bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#142c50,transparent 42%),radial-gradient(ellipse at 95% 30%,#18224c,transparent 35%),var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}header{text-align:center;padding:34px 16px 18px}.logo{width:64px;height:64px;border:1px solid var(--blue);border-radius:18px;display:grid;place-items:center;margin:auto auto 14px;font-size:22px;font-weight:900;color:var(--blue);box-shadow:0 0 25px #1878ff55}h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0 0 10px}header p{max-width:650px;color:var(--muted);margin:auto}.wrap{max-width:900px;margin:auto;padding:0 14px 50px}.toolbar{position:sticky;top:0;z-index:4;background:#07111fee;backdrop-filter:blur(12px);display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}input,select,button{font:inherit;color:var(--text);background:#0e1d31;border:1px solid var(--line);border-radius:10px;padding:10px 12px}input[type=search]{flex:1;min-width:170px}button{cursor:pointer}button:hover{border-color:var(--blue)}.primary{background:linear-gradient(120deg,#087dbb,#5147c9)}.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:18px}.stat{background:#0c1a2c;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--muted);font-size:13px}.stat b{color:white}.progress{height:6px;background:#182940;border-radius:10px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));width:0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tab.active{border-color:var(--blue);background:#123454}h2{font-size:21px;margin:24px 0 10px}.card{background:#101f34e8;border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0}.qrow{display:flex;gap:10px;align-items:flex-start}.num{background:#1a3554;color:var(--blue);border-radius:9px;padding:5px 8px;font-weight:800;font-size:13px}.qtext{flex:1;font-weight:600}.done{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:12px}.done input{accent-color:var(--green)}textarea{width:100%;min-height:86px;margin-top:12px;padding:11px;background:#081525;color:var(--text);border:1px solid #253a56;border-radius:10px;font:inherit;resize:vertical}.note{color:#bcefe2;background:#0b2a2a66;border:1px solid #47d8b44d;border-radius:12px;padding:11px;margin:18px auto;max-width:700px;font-size:13px}.muted{color:var(--muted);font-size:13px}@media print{body{background:white;color:#111}.toolbar,.tabs,button,.progress,.done{display:none!important}.card{background:white;color:#111;break-inside:avoid}textarea{color:#111;background:white}header p,.muted{color:#555}}</style></head><body><header><div class="logo">T19</div><h1>የማሰላሰል ማስታወሻ ደብተር</h1><p>ቅን ሁን፣ ለማስደመም አትሞክር። ጊዜህን ውሰድ። ሕይወትህን በአንድ ጊዜ መፍታት አያስፈልግህም።</p><div class="stats"><div class="stat"><b id="total">131</b> ጥያቄዎች</div><div class="stat"><b id="answered">0</b> የተመለሱ</div><div class="stat"><b id="doneCount">0</b> የተጠናቀቁ</div></div><div class="note">መልሶችህ በዚህ አሳሽ ውስጥ፣ በዚህ መሣሪያ ላይ ይቀመጣሉ። የተለየ ቅጂ ለማስቀመጥ ወደ ውጭ በማውጣት ባክአፕ አድርግ።</div></header><main class="wrap"><div class="toolbar"><input type="search" id="search" placeholder="ጥያቄዎችን ፈልግ…"><select id="filter"><option value="all">ሁለቱም ስብስቦች</option><option value="one">ስብስብ 1 · 80 ጥያቄዎች</option><option value="two">ስብስብ 2 · 51 ጥያቄዎች</option></select><button class="primary" id="export">መልሶችን አውጣ</button><button id="print">አትም</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tabs" id="tabs"></div><div id="content"></div><p class="muted" style="text-align:center;margin-top:28px">T19 · የግል ማሰላሰል፣ በአንድ ጊዜ አንድ ቅን መልስ።</p></main><script>
const DATA={"sets": [{"key": "one", "title": "ከሁሉም በታች ያለው ሰው", "sections": [{"title": "I · ማንነት እና እውነት", "questions": ["ማንም በማይመለከተኝ ጊዜ እኔ ማን ነኝ?", "ከባህሪዬ ውስጥ የትኞቹ ክፍሎች እውነተኛ ናቸው፣ የትኞቹስ ትርኢት ናቸው?", "ማሳሰቤ ተጋላጭ እንድሆን ስለሚያደርገኝ፣ ግድ የማልሰጥ መስሎ የማስመሰለው ምንድን ነው?", "ስለ ራሴ በቁም ነገር በጭራሽ ያልጠረጠርኩት እምነት ምንድን ነው?", "መቼ ነው ራሴ መሆኔን በብዛት የሚሰማኝ?", "ሰዎች በጥልቀት ቢያውቁኝ፣ እንዲያገኙት የምፈራው ምንድን ነው?", "ያለሁ የምል እሴቶች የትኞቹ ናቸው፣ ተግባሮቼስ በእውነት የሚያሳዩት የትኞቹን ናቸው?", "ስለ ራሴ ያለውን የትኛውን እውነት ማየት እያራዘምኩ ነው?", "የሌላ ሰው ተስፋ መሠረት በማድረግ የምኖረው የት ነው?", "ማንንም ለማስደመም መሞከር ብተው፣ ምን ይለወጣል?"]}, {"title": "II · ፍርሃት እና ማስወገድ", "questions": ["ልፈተን ይሆናል ብዬ ስለምፈራ የማስወገደው ምንድን ነው?", "በእውነቱ ፍርሃት ሳለ “ጊዜው አልተስማማም” ብዬ የምጠራው ምንድን ነው?", "በማዘናጋት የማምልጠው የትኛው የማይመች ስሜት ነው?", "ራሴን ትንሽ ተጨማሪ ብተማመን ምን ውሳኔ እወስድ ነበር?", "በምቾት ቦታዬ መቆየት የሚያስከፍለኝ ዋጋ ምንድን ነው?", "የበለጠ ስኬታማ ብሆን ማጣት የምፈራው ምንድን ነው?", "ማሰብን ከተግባር ጋር መቼ ቀላቅያለሁ?", "በቀጥታ ለመጋፈጥ ስለምእብ የሚመለሰው ችግር ምንድን ነው?", "ውርደት የማይቻል ቢሆን ምን እሞክር ነበር?", "ለመጀመር ፈቃድ እየጠበቅሁ ያለሁት ምንድን ነው?"]}, {"title": "III · ማረጋገጫ እና ትኩረት", "questions": ["የማን ማጽደቅ አሁንም በእኔ ላይ ከመጠን በላይ ሥልጣን አለው?", "ሰዎች ስለ እኔ ምን እንዲያስተውሉ እፈልጋለሁ፣ ለምንስ?", "ከምኞቴ ስንቱ እውነተኛ ነው፣ ስንቱስ የሆነ ነገር ለማረጋገጥ የሚደረግ ሙከራ ነው?", "ማንም ግስጋሴዬን ባያወድስ ኖሮ መቀጠል ነበር?", "የሆነ ሰው ቀላል አድርጎ መመልከቱን እንዲጸጸት ብዬ የማደርገው ምንድን ነው?", "ስኬትን ስሳለም፣ እያየኝ ያለው ማን እንደሆነ ነው የማስበው?", "የትኛውን ዓይነት ትኩረት ነው የሚራበኝ?", "የማይታይ ወይም አስፈላጊ ያልሆንኩ ሲመስለኝ እንዴት እሰራለሁ?", "ዋጋዬን ማረጋገጥ ባላስፈልገኝ ኖሮ ምን ማድረግ እተው ነበር?", "በክፍሉ ውስጥ እጅግ አስደናቂው ሰው ሳልሆን ራሴን ማድነቅ እችላለሁ?"]}, {"title": "IV · ፍቅር እና ግንኙነቶች", "questions": ["አንድን ሰው እንደሆነው ነው የምወደው፣ ወይስ ከእሱ ጋር የምሳለምን ወደፊት?", "ከእውነታ፣ ከተቻለ ነገር፣ ወይስ ከመፈለግ ስሜት ጋር ነው የተቆራኘሁት?", "ሌላ ሰው እንዲፈውስልኝ ወይም እንዲያረጋግጥልኝ የምጠብቀው ምንድን ነው?", "ውድቅ ሲሆን ስለ ዋጋዬ ምን ታሪክ ነው ለራሴ የምነግረው?", "የሌላ ሰው ምርጫ ቢያሳዝነኝም አከብረዋለሁ?", "ናፍቆትን ከመስማማት ጋር ቀላቅያለሁ?", "የራሴን ጨምሮ የትኞቹን ድንበሮች ማክበር አለብኝ?", "አንድን ሰው የሕይወቴ ማዕከል ሳደርገው መከብድ እችላለሁ?", "ቅርበትን ስፈራ የምደግመው ልማድ ምንድን ነው?", "በትርኢት ማግኘት ባልኖረብኝ ኖሮ ጤናማ ፍቅር እንዴት ይመስል ነበር?"]}, {"title": "V · ጥላ እና ኃላፊነት", "questions": ["በሌሎች ሰዎች ውስጥ በጣም የሚያበሳጨኝ ባህሪ ምንድን ነው፣ ለምንስ በዚህ ያህል ኃይለኛ ተጽዕኖ ያሳድ ወጥ ተስፋ ይልቅ ከመከራ ጋር የበለጠ የተቆራኘሁ ነኝ?", "በዚህ ታሪክ ውስጥ ተጣብቄ በመቆየት ምን አተርፋለሁ?", "የሚያስፈልገኝን እርዳታ ከመጠየቅ ይልቅ ሌላ ሰው ሥቃዬን እንዲያስተውል እየጠበቅሁ ነው?", "ስኬቴ የሆነን ሰው እንዲጸጸት እንደሚያደርገው በምስጢር ተስፋ አደርጋለሁ?", "የፍቅር አካል የሆነው የመርሳት ፍርሃት ሳለ ፍቅር ብዬ እጠራዋለሁ?", "እውነተኛውን ሰው ነው የሚናፍቀኝ፣ ወይስ ከእሱ ጎን ሳለሁ ያሰብኩትን የራሴን ቅጂ?", "ቅዠቱ የተሻለ ስለሚሰማኝ እየተዘነጋሁት ያለሁት እውነታ ምንድን ነው?", "ተቻለ የሚል ነገርን እንደ ቃል ኪዳን አድርጌ የምይዘው የት ነው?", "ለሕይወቴ ትርጉም የሚሰጥ ሌላ ሰው አድርጌያለሁ?", "እውነታውን በመጨረሻ ብቀበል ማዘን ያለብኝ ምንድን ነው?", "ውሳኔ ከመወሰን ለማምለጥ ትንታኔን እየተጠቀምኩ ነው?", "ደጋግሞ ቢያሳዝነኝም ደጋግሜ የምፈትሸው ምንድን ነው?", "ኃይለኛነትን ከቅርበት ጋር ቀላቅያለሁ?", "የፈለግሁት ውጤት ስላልሆነ ልቀበለው የተቸገርኩበት ድንበር ምንድን ነው?", "ሊመርጠኝ እንደማይችል ቢያሰኝም የሌላ ሰውን ነጻነት አከብራለሁ?", "በግልጽ ሳልናገር ሌላ ሰው እንዲረዳው የምፈልገው ምንድን ነው?", "ችላ ተብዬ ሲሰማኝ መረዳትን ነው የምፈልገው ወይስ ቁጥጥርን መልሶ ለማግኘት ነው የምሞክረው?", "ከባህሪዬ ውስጥ ለሌላ ሰው መታገስ የሚከብደው የትኛው ነው?", "የተጎዳሁ ብቻ ነኝ እያልኩ ለራሴ ፍትሕ ያልሰጠሁበት የት ነው?", "ይህ ቁርኝት ካለቀ ከእኔ ምን ይቀራል ብዬ እፈራለሁ?"]}, {"title": "ሰበቦች፣ ኩራት እና ኃላፊነት", "questions": ["ለእኔ አሳማኝ የሚመስል ግን ሕይወቴን ሳይለውጥ የሚያቆይ ሰበብ ምንድን ነው?", "አንድ ማድረግ የምችለው ነገር ሳለ ሁኔታዎችን የምወቅስበት የት ነው?", "በሌሎች ላይ የምተችበት ነገር በሌላ መልኩ እኔም የማደርገው ምንድን ነው?", "ማሻሻል ነው የምፈልገው፣ ወይስ በዋናነት ሰዎች የተሻሻልኩ አድርገው እንዲያዩኝ?", "ቅን ከመሆን ይልቅ ትክክል መሆንን መቼ መረጥኩ?", "የትኛው እውነት እርምጃ ለመውሰድ ኃላፊነት ያስይዘኛል?", "ለራሴ የሰጠሁትን የትኛውን ቃል ደጋግሜ እያፈረስኩ ነው?", "ሊሠራ የሚችል ዕቅድ ሳላዘጋጅ ከራሴ ተግሣጽ የምጠይቅበት የት ነው?", "በጣም አስፈላጊ ነው የምለውን ሥራ በማራዘሜ ምን አገኛለሁ?", "በራስ መተማመንን የሚገነባውን ነገር ከማድረግ በፊት በራስ መተማመንን እየጠበቅሁ ነው?", "ዕድገትን የሚያግድ በሆነ መንገድ ያለፈውን ሕይወቴን ለራሴ ማብራሪያ አድርጌ የተጠቀምኩበት ጊዜ መቼ ነው?", "ከሱ ከመማር ይልቅ አሁንም ራሴን የምቀጣበት ስህተት የትኛው ነው?", "ሰበብ ሳልጨምር ይቅርታ መጠየቅ አውቃለሁ?", "መቆጣጠር የማልችለውን ምን መቀበል አለብኝ?", "የሌላ ሰውን ስለ እኔ ያለውን አስተያየት ለመቆጣጠር የምሞክርበት የት ነው?", "በምናብ የምናደርገውን ክርክር ሁሉ ማሸነፍ ባላስፈልገኝ ምን ይለወጣል?"]}, {"title": "ዋጋ፣ ዓላማ እና የሚቀጥለው እርምጃ", "questions": ["ማንም ባያወድሰኝ ሕይወቴን ትርጉም የሚሰጠው ምን ይሆናል?", "ማስደመም የምፈልገው ሰው ስኬቴን ባያይ ኖሮ አሁንም እከታተለው ነበር?", "ዋጋዬን ከማረጋገጥ ባሻገር ገንዘብ ምን እንዲቻል እፈልጋለሁ?", "በምቾት ለመኖር የሚበቃ ገንዘብ ቢኖረኝ፣ ምን ለመለማመድ ወይም ለመፍጠር እመርጥ ነበር?", "ሲከብድ እንኳ መማሩን ለመቀጠል በእውነት የሚያስጨብጠኝ ምንድን ነው?", "ለእኔ አስፈላጊ ስለሆነ በደስታ የምሠራበት ችግር ምንድን ነው?", "የዕለት ተዕለት ምርጫዎቼ እፈልጋለሁ የምለውን ወደፊት ይደግፋሉ?", "ለማጽደቅ ሲባል መስዋዕት የማድረግ ሃብት የሌለኝን ምን ነው እያሰዋወቅሁ?", "ተራ ቀንን “ወደኋላ ቀርቻለሁ” ማለት ሳይሆን መደሰት እችላለሁ?", "ራስን ማክበር ማድረግ እንድተው የሚጠይቀው ምንድን ነው?", "ራስን መውደድ በቀጣይነት ማድረግ እንድጀምር የሚጠይቀው ምንድን ነው?", "ኃላፊነቱን እየተቀበልኩ ራሴን ይቅር ለማለት የተዘጋጀሁበት ነገር ምንድን ነው?", "ምን ዓይነት ድጋፍ እድገቴን ይረዳል፣ እሱንስ ለመፈለግ ፈቃደኛ ነኝ?", "ምልክቶችን ያለማቋረጥ ከመተርጎም ይልቅ መቀበል ያለብኝ አንድ እውነታ ምንድን ነው?", "ማንም ሊያረጋግጥልኝ እንደማይመጣ ብገነዘብ፣ አሁንም በእውነት የምወደውን ሕይወት መገንባት እችል ነበር?"]}]}]};const $=id=>document.getElementById(id);let active="all";
function read(k){try{return JSON.parse(localStorage.getItem("t19journal-"+k)||"{}")}catch(e){return {}}}function write(k,v){localStorage.setItem("t19journal-"+k,JSON.stringify(v))}
function render(){const host=$("content"),tabs=$("tabs"),filter=$("filter").value,term=$("search").value.toLowerCase().trim();host.innerHTML="";tabs.innerHTML="";[["all","ሁሉም ክፍሎች"],["one","ስብስብ 1 · 80"],["two","ስብስብ 2 · 51"]].forEach(([k,label])=>{if(filter!=="all"&&k==="all")return;let b=document.createElement("button");b.className="tab "+(active===k?"active":"");b.textContent=label;b.onclick=()=>{active=k;render()};tabs.append(b)});let shown=0;
DATA.sets.forEach(s=>{if((filter!=="all"&&filter!==s.key)||(active!=="all"&&active!==s.key))return;let vals=read(s.key),base=s.key==="one"?1:81;let counter=base;s.sections.forEach((sec,si)=>{let qs=sec.questions.map((q,qi)=>({q,qi,num:counter+qi})).filter(x=>!term||x.q.toLowerCase().includes(term));counter+=sec.questions.length;if(!qs.length)return;let h=document.createElement("h2");h.textContent=s.title+" · "+sec.title;host.append(h);qs.forEach(x=>{shown++;let key=si+"-"+x.qi,v=vals[key]||{};let card=document.createElement("section");card.className="card";let row=document.createElement("div");row.className="qrow";let num=document.createElement("span");num.className="num";num.textContent=x.num;let txt=document.createElement("div");txt.className="qtext";txt.textContent=x.q;let lab=document.createElement("label");lab.className="done";let cb=document.createElement("input");cb.type="checkbox";cb.checked=!!v.done;lab.append(cb,document.createTextNode("ተጠናቋል"));row.append(num,txt,lab);card.append(row);let ta=document.createElement("textarea");ta.placeholder="ቅን መልስህን እዚህ ጻፍ…";ta.value=v.answer||"";card.append(ta);let timer;ta.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{let d=read(s.key);d[key]=d[key]||{};d[key].answer=ta.value;write(s.key,d);stats()},150)};cb.onchange=()=>{let d=read(s.key);d[key]=d[key]||{};d[key].done=cb.checked;write(s.key,d);stats()};host.append(card)})})});if(!shown)host.textContent="ከፍለጋህ ጋር የሚመሳሰል ጥያቄ የለም።";stats()}
function stats(){let a=0,d=0;DATA.sets.forEach(s=>Object.values(read(s.key)).forEach(v=>{if((v.answer||"").trim())a++;if(v.done)d++}));$("answered").textContent=a;$("doneCount").textContent=d;$("bar").style.width=(d/131*100)+"%"}
$("search").oninput=render;$("filter").onchange=()=>{active="all";render()};$("print").onclick=()=>window.print();$("export").onclick=()=>{let out="T19 የማሰላሰል ማስታወሻ ደብተር\n\n";DATA.sets.forEach(s=>{let d=read(s.key);out+=s.title+"\n\n";s.sections.forEach((sec,si)=>{out+=sec.title+"\n";sec.questions.forEach((q,qi)=>{let v=d[si+"-"+qi]||{};out+=q+"\n"+(v.done?"[ተጠናቋል] ":"")+(v.answer||"[መልስ የለም]")+"\n\n"})})});let blob=new Blob([out],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="T19-መልሶች.txt";a.click();URL.revokeObjectURL(url)};$("total").textContent=DATA.sets.reduce((n,s)=>n+s.sections.reduce((a,x)=>a+x.questions.length,0),0);render();
</script></body></html>
